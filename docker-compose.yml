# Local development database only. Use managed/hardened Postgres and your own passwords in production.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev_password
      POSTGRES_DB: nexora_school
    ports:
      - "5432:5432"
    volumes:
      - nexora_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora_school"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nexora_pgdata:
